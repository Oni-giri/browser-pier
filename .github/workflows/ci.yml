name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# A newer run on the same ref cancels the older one, so an older commit can never overwrite `edge`.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs; Dependabot keeps them current.
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - run: make test
      - run: make build
      - run: make release-files

  # Pull requests build the orchestrator image without any package credentials.
  image:
    if: github.event_name == 'pull_request'
    needs: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=browser-pier

  # Builds the browser image (amd64) and runs the tests that need Docker
  # against it: login persistence across stop, start and rebuild, sandbox,
  # WebGL, window placement, xdotool and the H.264 stream.
  chromium:
    needs: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: mkdir -p "$RUNNER_TEMP/artifacts"
      - run: make test-docker
        env:
          BROWSERPIER_TEST_ARTIFACTS: ${{ runner.temp }}/artifacts
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chromium-screenshot
          path: ${{ runner.temp }}/artifacts
          if-no-files-found: ignore

  # Only pushes to main and v* tags get packages: write, and publish to ghcr.io.
  publish:
    if: github.event_name == 'push'
    needs: [go, chromium]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: browser-pier
            dockerfile: Dockerfile
          - name: browser-pier-chromium
            dockerfile: images/chromium/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Releases are vX.Y.Z only: the orchestrator picks its browser image
      # by that form, and anything else would get edge.
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::release tags are vX.Y.Z, not $GITHUB_REF_NAME"; exit 1; }
      - id: version
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      # The browser image installs packages for each platform, so arm64 needs emulation.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/oni-giri/${{ matrix.name }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # A v* tag also makes the GitHub release, once both images are published:
  # the install files pinned to the version, and its CHANGELOG.md section.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: deploy/release-files.sh "${GITHUB_REF_NAME#v}" dist
      - name: Both images exist, and their digests go in the notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          { echo; echo "**Images**, to pin as the Umbrel app does:"; echo; } >>dist/notes.md
          for image in browser-pier browser-pier-chromium; do
            ref="ghcr.io/oni-giri/$image:$v"
            docker buildx imagetools inspect "$ref"
            digest=$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' "$ref" | tr -d '"' || true)
            case $digest in
            sha256:*) echo "- \`$ref@$digest\`" >>dist/notes.md ;;
            *) echo "::warning::no digest for $ref" && echo "- \`$ref\`" >>dist/notes.md ;;
            esac
          done
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "BrowserPier $GITHUB_REF_NAME" --notes-file dist/notes.md dist/docker-compose.yml dist/Caddyfile dist/env.example
        env:
          GH_TOKEN: ${{ github.token }}
