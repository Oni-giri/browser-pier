version: "2"

run:
  build-tags:
    - docker

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
  exclusions:
    rules:
      # The entrypoint runs fixed binaries (Xvfb, Chromium, GStreamer) with validated arguments.
      - path: images/chromium/entrypoint/
        linters: [gosec]
        text: G204
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Oni-giri/browser-pier
