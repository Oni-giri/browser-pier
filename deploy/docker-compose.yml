# BrowserPier on a plain server. See README.md in this folder.
#
#   cp .env.example .env    # then edit it
#   install -d -m 700 data
#   docker compose up -d                   # behind your own HTTPS proxy, or Tailscale
#   docker compose --profile https up -d   # with Caddy getting a certificate
#
# Browser containers are started by BrowserPier itself, from its own
# browser image; they aren't listed here.

services:
  browserpier:
    image: ghcr.io/oni-giri/browser-pier:${BROWSERPIER_VERSION:-latest}
    restart: unless-stopped
    # Your user, so the files in ./data are yours. Browsers run as it too.
    user: "${PUID:-1000}:${PGID:-1000}"
    # The Docker socket's group, so BrowserPier can start browsers:
    # `stat -c %g /var/run/docker.sock`. Anything that can use this socket
    # controls the host: see "The Docker socket" in README.md.
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      BROWSERPIER_PUBLIC_URL: ${BROWSERPIER_PUBLIC_URL:-}
      BROWSERPIER_WEBRTC_IPS: ${BROWSERPIER_WEBRTC_IPS:-}
      BROWSERPIER_RAM_LIMIT_PERCENT: ${BROWSERPIER_RAM_LIMIT_PERCENT:-}
      BROWSERPIER_ADMIN_PASSWORD: ${BROWSERPIER_ADMIN_PASSWORD:-}
      # Caddy's X-Forwarded-For is believed, no one else's: its address
      # below. With your own proxy on this host, set it to the network's
      # gateway (10.247.74.1) instead; set it empty to believe none.
      BROWSERPIER_TRUSTED_PROXIES: ${BROWSERPIER_TRUSTED_PROXIES-10.247.74.3}
      # TURN, for viewers on networks that block UDP or direct connections:
      # the bundled server below, or another. See "TURN" in README.md.
      BROWSERPIER_TURN_URLS: ${BROWSERPIER_TURN_URLS:-}
      BROWSERPIER_TURN_SECRET: ${BROWSERPIER_TURN_SECRET:-}
      BROWSERPIER_TURN_USERNAME: ${BROWSERPIER_TURN_USERNAME:-}
      BROWSERPIER_TURN_PASSWORD: ${BROWSERPIER_TURN_PASSWORD:-}
      # The bundled TURN server relays to BrowserPier here, on this network.
      BROWSERPIER_TURN_PEER_IPS: ${BROWSERPIER_NET:-10.247.74}.2
    networks:
      default:
        ipv4_address: ${BROWSERPIER_NET:-10.247.74}.2
    ports:
      # The app. Only on this machine by default: reach it through Caddy,
      # your own proxy, or set BROWSERPIER_BIND to a Tailscale address.
      - "${BROWSERPIER_BIND:-127.0.0.1}:7437:7437"
      # Live views (WebRTC): open to the people who'll watch or take over.
      - "7438:7438/udp"
      - "7438:7438/tcp"

  caddy:
    image: caddy:2
    profiles: [https]
    restart: unless-stopped
    # Gets and renews a certificate for the domain, and proxies to
    # BrowserPier, WebSockets included. See Caddyfile: no access log, and
    # tokens in query strings (?token= for CDP) are redacted from errors.
    environment:
      BROWSERPIER_DOMAIN: ${BROWSERPIER_DOMAIN:-set-BROWSERPIER_DOMAIN-in-.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - browserpier
    networks:
      default:
        ipv4_address: ${BROWSERPIER_NET:-10.247.74}.3

  turn:
    # coturn, for live viewers on networks that block UDP or direct
    # connections (`--profile turn`, with BROWSERPIER_TURN_SECRET and
    # BROWSERPIER_TURN_URLS in .env). It relays only to BrowserPier's
    # address on this network, UDP only, so it publishes no relay ports
    # and can't be used to reach anything else.
    image: docker.io/coturn/coturn:4.7.0
    profiles: [turn]
    restart: unless-stopped
    # One capability: 3478 isn't a privileged port, but the image's
    # turnserver carries NET_BIND_SERVICE as a file capability and won't
    # start without it. It writes only its settings and pid file, to /tmp.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    environment:
      BROWSERPIER_TURN_SECRET: ${BROWSERPIER_TURN_SECRET:-}
      TURN_IP: ${BROWSERPIER_NET:-10.247.74}.4
      BROWSERPIER_IP: ${BROWSERPIER_NET:-10.247.74}.2
    # The settings, secret included, go to a file only coturn reads, not
    # its command line, which every process on the host can see.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ "$${#BROWSERPIER_TURN_SECRET}" -lt 16 ]; then
          echo "turn: set BROWSERPIER_TURN_SECRET in .env, at least 16 characters (openssl rand -hex 32)" >&2
          exit 1
        fi
        umask 077
        cat >/tmp/turnserver.conf <<EOF
        listening-ip=$$TURN_IP
        listening-port=$${TURN_PORT:-3478}
        relay-ip=$$TURN_IP
        no-tls
        no-dtls
        realm=browserpier
        use-auth-secret
        static-auth-secret=$$BROWSERPIER_TURN_SECRET
        fingerprint
        stale-nonce=600
        # TURN only: no answers to unauthenticated STUN requests.
        no-stun
        # Relay to BrowserPier and nowhere else: not to the host, its LAN
        # or other containers, and not to the internet. This allows an
        # address, every port on it; relaying UDP only (no TCP relays)
        # keeps BrowserPier's web app out of reach.
        denied-peer-ip=0.0.0.0-255.255.255.255
        denied-peer-ip=::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
        allowed-peer-ip=$$BROWSERPIER_IP
        no-tcp-relay
        no-multicast-peers
        # Relays per viewer (BrowserPier gives each its own user), and in
        # all. Generous: a page asks for one per TURN URL and network
        # interface, and a UDP relay a page left without releasing it
        # counts until it times out (up to 10 minutes).
        user-quota=40
        total-quota=300
        no-cli
        pidfile=/tmp/turnserver.pid
        log-file=stdout
        simple-log
        EOF
        unset BROWSERPIER_TURN_SECRET
        exec turnserver -c /tmp/turnserver.conf
    ports:
      # Open to the people who'll watch or take over browsers. TCP is
      # for networks that block UDP.
      - "3478:3478/udp"
      - "3478:3478/tcp"
    networks:
      default:
        ipv4_address: ${BROWSERPIER_NET:-10.247.74}.4

# A network of its own, with fixed addresses, so BrowserPier can believe
# Caddy and no one else. If 10.247.74.0/24 clashes with a network you
# use, set BROWSERPIER_NET to other first three numbers, and
# BROWSERPIER_TRUSTED_PROXIES to match (….3).
networks:
  default:
    ipam:
      config:
        - subnet: ${BROWSERPIER_NET:-10.247.74}.0/24

volumes:
  caddy_data:
  caddy_config:
